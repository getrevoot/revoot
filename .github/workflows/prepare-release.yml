name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release-pr:
    name: Update release pull request
    if: ${{ github.repository_owner == 'getrevoot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.5
          install: true
          cache: true
      - name: Open or update release pull request
        run: mise run release:pr
        env:
          # release-plz CLI maps --git-token to GIT_TOKEN.
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
