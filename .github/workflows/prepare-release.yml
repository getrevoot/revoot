name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release-pr:
    name: Update release pull request
    if: ${{ github.repository_owner == 'getrevoot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.5
          install: true
          cache: true
      - name: Open or update release pull request
        run: mise run release:pr
        env:
          # release-plz CLI maps --git-token to GIT_TOKEN.
          GIT_TOKEN: ${{ steps.release-token.outputs.token }}
