name: Publish preview image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag, such as rc-0.2.0-1 or branch-incremental-review
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Install toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          version: 2026.8.5
          install: true
          cache: true
      - name: Select preview tag
        id: preview
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source SHA must be a canonical Git commit ID" >&2
            exit 2
          fi
          sha_tag=sha-${SOURCE_SHA:0:12}
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag=$REQUESTED_TAG
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            tag=main
          else
            tag=$sha_tag
          fi
          if [[ ! "$tag" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
            echo "tag must use 1-64 lowercase letters, digits, dots, underscores, or hyphens" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"
      - name: Build Linux AMD64 binary
        run: mise run package:linux:release:amd64
      - name: Publish preview image
        env:
          GHCR_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.preview.outputs.tag }}
          SHA_TAG: ${{ steps.preview.outputs.sha_tag }}
        run: |
          mkdir image-context
          tar -xOzf dist/revoot-linux-amd64.tar.gz revoot > image-context/revoot
          chmod 0555 image-context/revoot
          cp packaging/oci/Dockerfile image-context/Dockerfile
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE:$PREVIEW_TAG" \
            --tag "$IMAGE:$SHA_TAG" image-context
          docker push "$IMAGE:$PREVIEW_TAG"
          if [[ "$SHA_TAG" != "$PREVIEW_TAG" ]]; then
            docker push "$IMAGE:$SHA_TAG"
          fi
          printf 'Published `%s:%s` and `%s:%s`\n' \
            "$IMAGE" "$PREVIEW_TAG" "$IMAGE" "$SHA_TAG" >> "$GITHUB_STEP_SUMMARY"
