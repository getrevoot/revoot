name: Publish preview image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag, such as rc-0.2.0-1 or branch-incremental-review
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.5
          install: true
          cache: true
      - name: Select preview tag
        id: preview
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag=${REQUESTED_TAG:-sha-${GITHUB_SHA:0:12}}
          if [[ ! "$tag" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
            echo "tag must use 1-64 lowercase letters, digits, dots, underscores, or hyphens" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build Linux AMD64 binary
        run: mise run package:linux:release:amd64
      - name: Publish preview image
        env:
          GHCR_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.preview.outputs.tag }}
        run: |
          mkdir image-context
          tar -xOzf dist/revoot-linux-amd64.tar.gz revoot > image-context/revoot
          chmod 0555 image-context/revoot
          cp packaging/oci/Dockerfile image-context/Dockerfile
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$IMAGE:$PREVIEW_TAG" image-context
          docker push "$IMAGE:$PREVIEW_TAG"
          printf 'Published `%s:%s`\n' "$IMAGE" "$PREVIEW_TAG" >> "$GITHUB_STEP_SUMMARY"
