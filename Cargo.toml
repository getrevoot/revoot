[workspace]
members = [
  "crates/revoot",
  "crates/revoot-core",
]
default-members = ["crates/revoot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
gix = { version = "0.87", default-features = false, features = ["revision", "sha1", "dirwalk"] }
similar = "2.7"
libc = "0.2"
revoot-core = { path = "crates/revoot-core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
webpki-roots = "1"

[profile.release]
codegen-units = 1
lto = "fat"
debug = 0
incremental = false
panic = "abort"
strip = "symbols"

[profile.distribution-debug]
inherits = "release"
debug = 2
lto = "off"
panic = "unwind"
strip = "none"
