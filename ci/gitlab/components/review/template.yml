spec:
  inputs:
    stage:
      default: .post
      description: Pipeline stage used to group the review job.
    needs:
      type: array
      default: []
      description: Jobs that must finish before review; empty starts immediately.
    image:
      description: Required immutable Revoot image reference ending in @sha256:DIGEST.
      regex: '^[-a-zA-Z0-9._/:]+@sha256:[0-9a-f]{64}$'
    provider:
      default: auto
      description: Model provider adapter.
    model:
      default: auto
      description: Provider model name.
    fork_behavior:
      default: skip
      options:
        - skip
        - report-only
      description: Safe behavior when source and target projects differ.
---

revoot-review:
  stage: $[[ inputs.stage ]]
  needs: $[[ inputs.needs ]]
  interruptible: true
  resource_group: revoot-$CI_PROJECT_ID-$CI_MERGE_REQUEST_IID
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  variables:
    REVOOT_PROVIDER: $[[ inputs.provider ]]
    REVOOT_MODEL: $[[ inputs.model ]]
    REVOOT_FORK_BEHAVIOR: $[[ inputs.fork_behavior ]]
    REVOOT_PUBLICATION_ENABLED: "true"
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_MERGE_REQUEST_TARGET_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && "$[[ inputs.fork_behavior ]]" == "report-only"'
  script:
    - revoot review --ci --format json --output revoot-review.json
  artifacts:
    when: always
    access: developer
    expire_in: 7 days
    paths:
      - revoot-review.json
