name: Revoot review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: revoot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ vars.REVOOT_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 0:0 --security-opt no-new-privileges
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare workspace
        run: chown 65532:65532 "$GITHUB_WORKSPACE"
      - name: Review pull request
        run: su -p -s /bin/sh revoot -c 'exec revoot review --ci --format json --output revoot-review.json'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVOOT_GITHUB_TOKEN: ${{ secrets.REVOOT_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVOOT_PROVIDER: ${{ vars.REVOOT_PROVIDER || 'auto' }}
          REVOOT_MODEL: ${{ vars.REVOOT_MODEL || 'auto' }}
          REVOOT_FORK_BEHAVIOR: skip
          REVOOT_PUBLICATION_ENABLED: "true"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: revoot-review
          path: revoot-review.json
          if-no-files-found: ignore
          retention-days: 7
